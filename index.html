<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>União e Xarp | O Point da Rua</title>
    
    <!-- Script Oficial do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Rubik:wght@400;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #0b0b0b;
            background-image: 
                radial-gradient(rgba(255,255,255,0.03) 1px, transparent 0),
                radial-gradient(rgba(255,255,255,0.02) 2px, transparent 0);
            background-size: 8px 8px, 16px 16px;
            color: #eceff1;
            font-family: 'Rubik', sans-serif;
            padding-bottom: 140px;
        }

        header {
            background: #000;
            border-bottom: 5px solid #00ff66;
            padding: 30px 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .logo {
            font-family: 'Permanent Marker', cursive;
            font-size: 4.5rem;
            color: #ff0055;
            text-transform: uppercase;
            text-shadow: 4px 4px 0px #00ff66, -2px -2px 0px #fff;
            letter-spacing: 3px;
            transform: rotate(-2deg);
            display: inline-block;
        }

        .tagline {
            font-size: 1.1rem;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 10px;
            font-weight: bold;
        }

        .container {
            max-width: 1300px;
            margin: 40px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
        }

        .section-box {
            background: rgba(15, 15, 15, 0.95);
            border: 3px solid #222;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 6px 6px 0px #111;
        }

        .section-title {
            font-family: 'Permanent Marker', cursive;
            font-size: 2rem;
            color: #00ff66;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .post-form input, .post-form textarea {
            width: 100%;
            background: #161616;
            border: 2px solid #333;
            color: #fff;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 12px;
            font-family: inherit;
        }

        .post-form input:focus, .post-form textarea:focus { border-color: #ff0055; outline: none; }

        .btn-spray {
            background: #ff0055;
            color: #fff;
            font-family: 'Permanent Marker', cursive;
            font-size: 1.3rem;
            border: none;
            padding: 10px 25px;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 4px 4px 0px #00ff66;
            transition: 0.1s ease-in;
        }

        .btn-spray:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0px #00ff66; }
        .btn-spray:disabled { background: #555; box-shadow: none; cursor: not-allowed; }

        .mural-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            margin-top: 30px;
        }

        .mural-card {
            background: #161616;
            border: 2px solid #222;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: 0.2s;
        }

        .mural-card:hover { border-color: #00ff66; }

        .mural-card img, .mural-card video {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-bottom: 3px solid #ff0055;
            background: #000;
        }

        .mural-info { padding: 15px; }
        .mural-user { color: #00ff66; font-weight: bold; font-size: 1.1rem; }
        .mural-text { font-size: 0.95rem; color: #bbb; margin-top: 5px; }

        .mural-actions {
            display: flex;
            border-top: 1px solid #222;
            background: #111;
            padding: 8px 15px;
            justify-content: space-between;
        }

        .action-btn {
            background: transparent;
            border: none;
            color: #fff;
            cursor: pointer;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: bold;
        }

        .action-btn:hover { color: #00ff66; }
        .action-btn.liked { color: #ff0055; }

        .card-comments-section {
            background: #121212;
            border-top: 1px solid #222;
            padding: 12px;
        }

        .comments-list {
            max-height: 100px;
            overflow-y: auto;
            margin-bottom: 8px;
            font-size: 0.85rem;
        }

        .comment-item { margin-bottom: 6px; line-height: 1.3; }
        .comment-user { color: #ff0055; font-weight: bold; margin-right: 4px; }

        .comment-input-box { display: flex; gap: 6px; }
        .comment-input-box input {
            flex-grow: 1;
            background: #1c1c1c;
            border: 1px solid #333;
            color: #fff;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 0.85rem;
        }

        .comment-btn {
            background: #00ff66;
            color: #000;
            border: none;
            padding: 0 10px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .chat-container { display: flex; flex-direction: column; height: 450px; }
        .chat-messages {
            flex-grow: 1;
            background: #111;
            border: 2px solid #222;
            padding: 15px;
            overflow-y: auto;
            border-radius: 6px;
            margin-bottom: 10px;
        }
        .chat-row { margin-bottom: 12px; font-size: 0.95rem; }
        .chat-user { color: #00ff66; font-weight: bold; margin-right: 5px; }
        .chat-user.me { color: #ff0055; }

        .radio-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #000;
            border-top: 4px solid #ff0055;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 1000;
        }
        .radio-details h3 { color: #ff0055; font-family: 'Permanent Marker', cursive; }
        .radio-details p { color: #00ff66; font-size: 0.9rem; font-weight: bold; }

        @media (max-width: 900px) {
            .container { grid-template-columns: 1fr; }
            .radio-footer { flex-direction: column; text-align: center; gap: 15px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">União e Xarp</div>
        <div class="tagline">O Point Oficial do Grafite, Rap, Reggae & MPB</div>
    </header>

    <div class="container">
        
        <!-- COLUNA DO MURAL -->
        <main class="section-box">
            <div class="section-title">🎨 MURAL DAS RUAS</div>
            
            <div class="post-form">
                <input type="text" id="mural-tag" placeholder="Seu Vulgo / Tag (Ex: Grapixo_ZN)" required>
                <textarea id="mural-legenda" placeholder="Qual é a fita do pico?" rows="2"></textarea>
                <input type="file" id="mural-file" accept="image/*,video/*" style="border: none; padding: 0; color:#aaa;">
                <button class="btn-spray" id="btn-submit-mural" onclick="enviarMural()">Agitar o Spray 💨</button>
            </div>

            <div class="mural-grid" id="mural-feed"></div>
        </main>

        <!-- COLUNA DO CHAT -->
        <aside class="section-box">
            <div class="section-title">💬 CHAT DA CREW</div>
            <div class="chat-container">
                <div class="chat-messages" id="chat-box"></div>
                <div class="post-form" style="display: flex; gap: 10px;">
                    <input type="text" id="chat-msg" placeholder="Manda a visão..." onkeydown="if(event.key === 'Enter') enviarMensagem()">
                    <button class="btn-spray" style="font-size: 1rem; padding: 5px 15px;" onclick="enviarMensagem()">💥</button>
                </div>
            </div>
        </aside>
    </div>

    <!-- PLAYER DA RÁDIO -->
    <div class="radio-footer">
        <div class="radio-details">
            <h3>📻 RÁDIO UNIÃO E XARP</h3>
            <p>🔴 No Ar: Transmissão Digital Direta</p>
        </div>
        <audio controls preload="none" src="https://rusp.suicid.com.br/usp-937-sp.mp3" style="filter: invert(1); max-width: 100%;"></audio>
    </div>

    <script>
        // ========================================================
        // INSIRA SUAS CREDENCIAIS DO SUPABASE AQUI
        // ========================================================
        const SUPABASE_URL = "https://SEU_PROJETO.supabase.co";
        const SUPABASE_ANON_KEY = "SUA_CHAVE_ANON_DO_SUPABASE";
        
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let meuVulgo = localStorage.getItem('vulgo') || "Anonimo_" + Math.floor(Math.random() * 1000);

        window.onload = async () => {
            document.getElementById('mural-tag').value = localStorage.getItem('vulgo') || '';
            carregarMural();
            carregarChat();
            inscreverTempoReal();
        };

        document.getElementById('mural-tag').addEventListener('input', (e) => {
            localStorage.setItem('vulgo', e.target.value.trim());
            meuVulgo = e.target.value.trim() || "Anonimo";
        });

        // ========================================================
        // LOGICA DO MURAL (LIMITADO AOS 15 MAIS RECENTES)
        // ========================================================
        async function carregarMural() {
            // Performance: Limita a busca em 15 registros para o site rodar leve
            const { data: posts, error: postErr } = await supabase.from('mural').select('*').order('created_at', { ascending: false }).limit(15);
            const { data: comentarios, error: comErr } = await supabase.from('comentarios_mural').select('*').order('created_at', { ascending: true });

            if (postErr || comErr) return console.error({postErr, comErr});
            
            const feed = document.getElementById('mural-feed');
            feed.innerHTML = '';

            posts.forEach(post => {
                const card = document.createElement('div');
                card.className = 'mural-card';
                
                let mediaTag = '';
                if(post.media_url) {
                    const urlLower = post.media_url.toLowerCase();
                    // Ajuste UX: playsinline e webkit-playsinline evitam quebra em telas de smartphones (iOS/Safari)
                    if(urlLower.includes('.mp4') || urlLower.includes('.webm') || urlLower.includes('video')) {
                        mediaTag = `<video src="${post.media_url}" controls playsinline webkit-playsinline></video>`;
                    } else {
                        mediaTag = `<img src="${post.media_url}" alt="Role" loading="lazy">`;
                    }
                }

                const curtidas = post.likes || 0;

                let listaComentariosHtml = '';
                if (comentarios) {
                    const filtrados = comentarios.filter(c => c.post_id === post.id);
                    filtrados.forEach(c => {
                        listaComentariosHtml += `
                            <div class="comment-item">
                                <span class="comment-user">${c.user}:</span><span>${c.text}</span>
                            </div>`;
                    });
                }

                card.innerHTML = `
                    ${mediaTag}
                    <div class="mural-info">
                        <div class="mural-user">✍️ ${post.tag}</div>
                        <div class="mural-text">${post.legenda}</div>
                    </div>
                    <div class="mural-actions">
                        <button class="action-btn" onclick="curtirPost(${post.id}, ${curtidas}, this)">
                            ❤️ <span class="like-count">${curtidas}</span>
                        </button>
                        <button class="action-btn" onclick="compartilharPost('${post.media_url || window.location.href}')">
                            🔗 Compartilhar
                        </button>
                    </div>
                    <div class="card-comments-section">
                        <div class="comments-list">${listaComentariosHtml || '<span style="color:#444; font-size:0.8rem;">Nenhum comentário...</span>'}</div>
                        <div class="comment-input-box">
                            <input type="text" placeholder="Comentar..." onkeydown="if(event.key === 'Enter') enviarComentario(${post.id}, this)">
                            <button class="comment-btn" onclick="enviarComentario(${post.id}, this.previousElementSibling)">➔</button>
                        </div>
                    </div>
                `;
                feed.appendChild(card);
            });
        }

        async function enviarMural() {
            const tag = document.getElementById('mural-tag').value.trim();
            const legenda = document.getElementById('mural-legenda').value.trim();
            const fileInput = document.getElementById('mural-file');
            const btnSubmit = document.getElementById('btn-submit-mural');
            
            if (!tag || !legenda) return alert("Insira seu vulgo e o relato da fita!");

            // UX Loading State: Altera o botão para evitar clique duplo durante upload
            btnSubmit.disabled = true;
            btnSubmit.innerText = "Agitando o Spray... ⏳";

            let mediaUrl = null;

            try {
                if (fileInput.files.length > 0) {
                    const file = fileInput.files[0];
                    const fileExt = file.name.split('.').pop();
                    const fileName = `${Date.now()}.${fileExt}`;
                    
                    const { error: uploadError } = await supabase.storage.from('mural_midia').upload(`uploads/${fileName}`, file);
                    if (uploadError) throw uploadError;

                    const { data } = supabase.storage.from('mural_midia').getPublicUrl(`uploads/${fileName}`);
                    mediaUrl = data.publicUrl;
                }

                const { error } = await supabase.from('mural').insert([{ tag, legenda, media_url: mediaUrl, likes: 0 }]);
                if (error) throw error;

                document.getElementById('mural-legenda').value = '';
                fileInput.value = '';
                carregarMural();

            } catch (err) {
                alert('Erro no envio da postagem: ' + err.message);
            } finally {
                // Restaura o estado original do botão
                btnSubmit.disabled = false;
                btnSubmit.innerText = "Agitar o Spray 💨";
            }
        }

        async function curtirPost(id, currentLikes, btn) {
            const { error } = await supabase.from('mural').update({ likes: currentLikes + 1 }).eq('id', id);
            if (!error) {
                btn.classList.add('liked');
                btn.disabled = true;
                carregarMural();
            }
        }

        async function enviarComentario(postId, inputElement) {
            const txt = inputElement.value.trim();
            if(!txt) return;

            const { error } = await supabase.from('comentarios_mural').insert([{ post_id: postId, user: meuVulgo, text: txt }]);
            if(!error) {
                inputElement.value = '';
                carregarMural();
            }
        }

        function compartilharPost(url) {
            navigator.clipboard.writeText(url).then(() => {
                alert("Link direto copiado para a área de transferência! Envie para a banca! 📲🔥");
            });
        }

        // ========================================================
        // LOGICA DO CHAT DA CREW (LIMITADO EM 35 MENSAGENS)
        // ========================================================
        async function carregarChat() {
            const { data, error } = await supabase.from('chat').select('*').order('created_at', { ascending: false }).limit(35);
            if (error) return;
            const chatBox = document.getElementById('chat-box');
            chatBox.innerHTML = '';
            data.reverse().forEach(msg => {
                const row = document.createElement('div');
                row.className = 'chat-row';
                row.innerHTML = `<span class="chat-user ${msg.user === meuVulgo ? 'me' : ''}">${msg.user}:</span> ${msg.text}`;
                chatBox.appendChild(row);
            });
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function enviarMensagem() {
            const input = document.getElementById('chat-msg');
            const text = input.value.trim();
            if (!text) return;
            await supabase.from('chat').insert([{ user: meuVulgo, text }]);
            input.value = '';
        }

        function inscribirTempoReal() {
            // Realtime unificado e limpo
            supabase.channel('hub_realtime')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'chat' }, () => carregarChat())
                .on('postgres_changes', { event: '*', schema: 'public', table: 'mural' }, () => carregarMural())
                .on('postgres_changes', { event: '*', schema: 'public', table: 'comentarios_mural' }, () => carregarMural())
                .subscribe();
        }
        
        // Aliasing para segurança de inicialização
        function inscreverTempoReal() { inscribirTempoReal(); }
    </script>
</body>
</html>
