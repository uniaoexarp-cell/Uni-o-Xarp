<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>União e Xarp | O Point da Rua</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Rubik:wght@400;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #08090a;
            background-image: 
                radial-gradient(rgba(0, 204, 68, 0.02) 1px, transparent 0),
                radial-gradient(rgba(230, 0, 0, 0.02) 2px, transparent 0);
            background-size: 12px 12px;
            color: #eceff1;
            font-family: 'Rubik', sans-serif;
            padding-bottom: 140px;
        }

        /* Topo nas Cores do Reggae (Red, Gold & Green) */
        header {
            background: #000;
            border-bottom: 6px solid #00cc44;
            padding: 35px 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(to right, #e60000 33%, #ffd600 33%, #ffd600 66%, #00cc44 66%);
        }

        .logo {
            font-family: 'Permanent Marker', cursive;
            font-size: 4.8rem;
            color: #ffd600;
            text-transform: uppercase;
            text-shadow: 4px 4px 0px #e60000, -3px -3px 0px #00cc44, 2px -2px 0px #fff;
            letter-spacing: 4px;
            transform: rotate(-1deg);
            display: inline-block;
        }

        .tagline {
            font-size: 1.1rem;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-top: 12px;
            font-weight: bold;
            text-shadow: 1px 1px 4px #000;
        }

        .container {
            max-width: 1300px;
            margin: 40px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
        }

        .section-box {
            background: rgba(14, 16, 15, 0.96);
            border: 3px solid #222;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 6px 6px 0px #000;
            margin-bottom: 30px;
        }

        .section-title {
            font-family: 'Permanent Marker', cursive;
            font-size: 2.2rem;
            color: #00cc44;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 12px;
            text-shadow: 2px 2px 0px #000;
        }

        .post-form input, .post-form textarea {
            width: 100%;
            background: #131614;
            border: 2px solid #2a302c;
            color: #fff;
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 12px;
            font-family: inherit;
            transition: 0.2s;
        }

        .post-form input:focus, .post-form textarea:focus { 
            border-color: #ffd600; 
            outline: none; 
            box-shadow: 0 0 10px rgba(255, 214, 0, 0.1);
        }

        .btn-spray {
            background: #e60000;
            color: #fff;
            font-family: 'Permanent Marker', cursive;
            font-size: 1.4rem;
            border: none;
            padding: 12px 28px;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 4px 4px 0px #ffd600;
            transition: 0.1s ease-in;
        }

        .btn-spray:active { 
            transform: translate(3px, 3px); 
            box-shadow: 1px 1px 0px #ffd600; 
        }

        .mural-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            margin-top: 30px;
        }

        .mural-card {
            background: #131614;
            border: 2px solid #222;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: 0.2s;
        }

        .mural-card:hover { border-color: #ffd600; }

        .mural-card img, .mural-card video {
            width: 100%;
            height: 230px;
            object-fit: cover;
            border-bottom: 3px solid #e60000;
            background: #000;
        }

        .mural-info { padding: 18px; }
        .mural-user { color: #ffd600; font-weight: bold; font-size: 1.15rem; }
        .mural-text { font-size: 0.98rem; color: #ccc; margin-top: 6px; }

        .mural-actions {
            display: flex;
            border-top: 1px solid #222;
            background: #0b0d0c;
            padding: 10px 18px;
            justify-content: space-between;
        }

        .action-btn {
            background: transparent;
            border: none;
            color: #fff;
            cursor: pointer;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: bold;
        }

        .action-btn:hover { color: #00cc44; }
        .action-btn.liked { color: #e60000; }

        .card-comments-section {
            background: #0b0d0c;
            border-top: 1px solid #1c1f1d;
            padding: 12px;
        }

        .comments-list {
            max-height: 105px;
            overflow-y: auto;
            margin-bottom: 10px;
            font-size: 0.88rem;
        }

        .comment-item { margin-bottom: 7px; line-height: 1.4; }
        .comment-user { color: #e60000; font-weight: bold; margin-right: 5px; }

        .comment-input-box { display: flex; gap: 8px; }
        .comment-input-box input {
            flex-grow: 1;
            background: #181c19;
            border: 1px solid #2a302c;
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.88rem;
        }

        .comment-btn {
            background: #00cc44;
            color: #000;
            border: none;
            padding: 0 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .chat-container { display: flex; flex-direction: column; height: 430px; }
        .chat-messages {
            flex-grow: 1;
            background: #0b0d0c;
            border: 2px solid #222;
            padding: 15px;
            overflow-y: auto;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        .chat-row { margin-bottom: 14px; font-size: 0.98rem; line-height: 1.4; }
        .chat-user { color: #ffd600; font-weight: bold; margin-right: 6px; }
        .chat-user.me { color: #00cc44; }

        /* Caixa de Pix Estilizada */
        .pix-box {
            text-align: center;
            background: #131614;
            border: 2px dashed #ffd600;
            padding: 15px;
            border-radius: 10px;
        }
        .pix-text {
            font-size: 0.9rem;
            color: #ccc;
            margin-bottom: 10px;
            line-height: 1.4;
        }
        .btn-pix {
            background: #ffd600;
            color: #000;
            font-family: 'Permanent Marker', cursive;
            font-size: 1.1rem;
            border: none;
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-pix:hover { background: #00cc44; color: #fff; }

        /* Rodapé da Rádio */
        .radio-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #000;
            border-top: 5px solid #ffd600;
            padding: 18px 35px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 1000;
            box-shadow: 0 -5px 25px rgba(0,0,0,0.8);
        }
        .radio-details h3 { color: #e60000; font-family: 'Permanent Marker', cursive; font-size: 1.6rem; letter-spacing: 1px; }
        .radio-details p { color: #00cc44; font-size: 0.95rem; font-weight: bold; margin-top: 2px; }

        @media (max-width: 900px) {
            .container { grid-template-columns: 1fr; }
            .radio-footer { flex-direction: column; text-align: center; gap: 15px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">União e Xarp</div>
        <div class="tagline">Grafite, Rap, Roots Reggae & Cultura de Rua</div>
    </header>

    <div class="container">
        
        <!-- MURAL CENTRAL -->
        <main class="section-box">
            <div class="section-title">🎨 LARICA CULTURAL & ARTES</div>
            
            <div class="post-form">
                <input type="text" id="mural-tag" placeholder="Seu Vulgo / Tag (Ex: Dada_Roots)" required>
                <textarea id="mural-legenda" placeholder="Manda a visão da arte ou do rolê roots..." rows="2"></textarea>
                <input type="file" id="mural-file" accept="image/*,video/*" style="border: none; padding: 0; color:#aaa; cursor: pointer;">
                <button class="btn-spray" id="btn-submit-mural" onclick="enviarMural()">Agitar o Spray 💨</button>
            </div>

            <div class="mural-grid" id="mural-feed"></div>
        </main>

        <!-- COLUNA LATERAL -->
        <aside>
            <!-- CHAT DA VIBE -->
            <div class="section-box">
                <div class="section-title">💬 CHAT DA VIBE</div>
                <div class="chat-container">
                    <div class="chat-messages" id="chat-box"></div>
                    <div class="post-form" style="display: flex; gap: 10px;">
                        <input type="text" id="chat-msg" placeholder="Manda a boa..." onkeydown="if(event.key === 'Enter') enviarMensagem()">
                        <button class="btn-spray" style="font-size: 1.1rem; padding: 5px 18px;" onclick="enviarMensagem()">💥</button>
                    </div>
                </div>
            </div>

            <!-- APRECIAR / FORTALECER (PIX) -->
            <div class="section-box">
                <div class="section-title">💰 FORTALEÇA A CREW</div>
                <div class="pix-box">
                    <p class="pix-text">Curtiu a plataforma e o som? Manda aquele Pix para apoiar os artistas e a compra de latas de spray!</p>
                    <button class="btn-pix" id="btn-pix-action" onclick="copiarPix()">Copiar Chave Pix 📋</button>
                </div>
            </div>
        </aside>
    </div>

    <!-- PLAYER DE ÁUDIO BLINDADO ANTIQUEDA -->
    <div class="radio-footer">
        <div class="radio-details">
            <h3>📻 RÁDIO UNIÃO ROOTS</h3>
            <p>🔴 No Ar: Transmissão Digital 24h</p>
        </div>
        
        <audio controls style="filter: invert(1); max-width: 100%;">
            <source src="https://live.hunter.fm/rap_high" type="audio/mpeg">
            <source src="https://stream.zeno.fm/088m9v0v40duv" type="audio/mpeg">
            <source src="https://rusp.suicid.com.br/usp-937-sp.mp3" type="audio/mpeg">
            Seu navegador não suporta o player de áudio.
        </audio>
    </div>

    <script>
        // BANCO DE DADOS LOCAL AUTOMÁTICO com Artes de Rua Reais
        let dbMural = JSON.parse(localStorage.getItem('local_mural')) || [
            { 
                id: 1, 
                tag: "Dada_Roots", 
                legenda: "Muro finalizado na Zona Leste! Respeito, cores e união nas ruas 🎨✌️", 
                media_url: "https://images.unsplash.com/photo-1569003339405-ea396a5a8a90?w=600&auto=format&fit=crop", 
                likes: 14 
            },
            { 
                id: 2, 
                tag: "Sampa_Graff", 
                legenda: "Rolê na madrugada rendeu esse bomb cabuloso. Salve a banca!", 
                media_url: "https://images.unsplash.com/photo-1534447677768-be436bb09401?w=600&auto=format&fit=crop", 
                likes: 8 
            }
        ];

        let dbComentarios = JSON.parse(localStorage.getItem('local_comentarios')) || [
            { post_id: 1, user: "Xarp_Mestre", text: "Trabalho fino demais, irmão!" },
            { post_id: 1, user: "Vibe_Positiva", text: "Roots total 🔥" }
        ];

        let dbChat = JSON.parse(localStorage.getItem('local_chat')) || [
            { user: "Grafite_011", text: "Salve rapaziada da União!" },
            { user: "Dada_Roots", text: "A rádio tá soltando só os sons pesados hoje." },
            { user: "Xarp_Mestre", text: "Mais tarde tem bomb no centro?" }
        ];

        let meuVulgo = localStorage.getItem('vulgo') || "Roots_" + Math.floor(Math.random() * 1000);
        
        // Chave Pix atualizada com o e-mail solicitado
        const chavePixValida = "uniaoexarp@gmail.com"; 

        window.onload = () => {
            document.getElementById('mural-tag').value = localStorage.getItem('vulgo') || '';
            atualizarTudo();
            ligarSimuladorCrew();
        };

        document.getElementById('mural-tag').addEventListener('input', (e) => {
            localStorage.setItem('vulgo', e.target.value.trim());
            meuVulgo = e.target.value.trim() || "Roots";
        });

        function salvarDados() {
            localStorage.setItem('local_mural', JSON.stringify(dbMural));
            localStorage.setItem('local_comentarios', JSON.stringify(dbComentarios));
            localStorage.setItem('local_chat', JSON.stringify(dbChat));
        }

        function atualizarTudo() {
            carregarMural();
            carregarChat();
        }

        // SISTEMA DE INTERAÇÃO DO PIX
        function copiarPix() {
            navigator.clipboard.writeText(chavePixValida).then(() => {
                const btn = document.getElementById('btn-pix-action');
                btn.innerText = "💥 CHAVE COPIADA! SALVE!";
                btn.style.background = "#00cc44";
                btn.style.color = "#fff";
                
                alert("Chave Pix (" + chavePixValida + ") copiada com sucesso! Fortaleceu o movimento! 🎨✊");

                setTimeout(() => {
                    btn.innerText = "Copiar Chave Pix 📋";
                    btn.style.background = "#ffd600";
                    btn.style.color = "#000";
                }, 4000);
            }).catch(err => {
                alert("Erro ao copiar automaticamente. Use a chave: " + chavePixValida);
            });
        }

        // ENGINE DO MURAL
        function carregarMural() {
            const feed = document.getElementById('mural-feed');
            feed.innerHTML = '';

            [...dbMural].reverse().forEach(post => {
                const card = document.createElement('div');
                card.className = 'mural-card';
                
                let mediaTag = '';
                if(post.media_url) {
                    if(post.media_url.startsWith('data:video') || post.media_url.includes('video')) {
                        mediaTag = `<video src="${post.media_url}" controls playsinline></video>`;
                    } else {
                        mediaTag = `<img src="${post.media_url}" alt="Arte" loading="lazy">`;
                    }
                }

                let listaComentariosHtml = '';
                const filtrados = dbComentarios.filter(c => c.post_id === post.id);
                filtrados.forEach(c => {
                    listaComentariosHtml += `
                        <div class="comment-item">
                            <span class="comment-user">${c.user}:</span><span>${c.text}</span>
                        </div>`;
                });

                card.innerHTML = `
                    ${mediaTag}
                    <div class="mural-info">
                        <div class="mural-user">✍️ ${post.tag}</div>
                        <div class="mural-text">${post.legenda}</div>
                    </div>
                    <div class="mural-actions">
                        <button class="action-btn" onclick="curtirPost(${post.id}, this)">
                            💚 <span class="like-count">${post.likes}</span>
                        </button>
                        <button class="action-btn" onclick="compartilharPost()">
                            🔗 Compartilhar
                        </button>
                    </div>
                    <div class="card-comments-section">
                        <div class="comments-list">${listaComentariosHtml || '<span style="color:#444; font-size:0.8rem;">Nenhum comentário...</span>'}</div>
                        <div class="comment-input-box">
                            <input type="text" placeholder="Comentar..." onkeydown="if(event.key === 'Enter') enviarComentario(${post.id}, this)">
                            <button class="comment-btn" onclick="enviarComentario(${post.id}, this.previousElementSibling)">➔</button>
                        </div>
                    </div>
                `;
                feed.appendChild(card);
            });
        }

        function enviarMural() {
            const tag = document.getElementById('mural-tag').value.trim();
            const legenda = document.getElementById('mural-legenda').value.trim();
            const fileInput = document.getElementById('mural-file');
            
            if (!tag || !legenda) return alert("Preencha seu vulgo e a mensagem!");

            const novoPost = {
                id: Date.now(),
                tag: tag,
                legenda: legenda,
                media_url: null,
                likes: 0
            };

            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                novoPost.media_url = URL.createObjectURL(file);
            }

            dbMural.push(novoPost);
            salvarDados();
            
            document.getElementById('mural-legenda').value = '';
            fileInput.value = '';
            carregarMural();
        }

        function curtirPost(id, btn) {
            const post = dbMural.find(p => p.id === id);
            if(post) {
                post.likes += 1;
                salvarDados();
                btn.querySelector('.like-count').innerText = post.likes;
                btn.classList.add('liked');
            }
        }

        function enviarComentario(postId, inputElement) {
            const txt = inputElement.value.trim();
            if(!txt) return;

            dbComentarios.push({ post_id: postId, user: meuVulgo, text: txt });
            salvarDados();
            inputElement.value = '';
            carregarMural();
        }

        function compartilharPost() {
            alert("Link copiado para a área de transferência! 📲🔥");
        }

        // ENGINE DO CHAT
        function carregarChat() {
            const chatBox = document.getElementById('chat-box');
            chatBox.innerHTML = '';
            
            dbChat.forEach(msg => {
                const row = document.createElement('div');
                row.className = 'chat-row';
                row.innerHTML = `<span class="chat-user ${msg.user === meuVulgo ? 'me' : ''}">${msg.user}:</span> ${msg.text}`;
                chatBox.appendChild(row);
            });
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function enviarMensagem() {
            const input = document.getElementById('chat-msg');
            const text = input.value.trim();
            if (!text) return;

            dbChat.push({ user: meuVulgo, text: text });
            salvarDados();
            input.value = '';
            carregarChat();
        }

        // ROBÔ SIMULADOR (Efeito "Site Vivo" na apresentação)
        function ligarSimuladorCrew() {
            const robos = ["Luz_Roots", "Grafite_011", "Rasta_Sampa", "Mestre_Bomb", "Vibe_Rua"];
            const mensagens = [
                "Essa rádio tá insana! Som pesado! 🔊🔥",
                "Acabei de mandar uma tag no mural, olhem lá!",
                "Arte salva vidas, rapaziada. Orgulho dessa crew.",
                "Alguém na ativa pra riscar hoje?",
                "Vibe positiva para todo mundo hoje!"
            ];

            setInterval(() => {
                const acao = Math.random() > 0.4 ? 'chat' : 'curtir';
                const roboAleatorio = robos[Math.floor(Math.random() * robos.length)];

                if (acao === 'chat') {
                    const msgAleatoria = mensagens[Math.floor(Math.random() * mensagens.length)];
                    dbChat.push({ user: roboAleatorio, text: msgAleatoria });
                    if(dbChat.length > 30) dbChat.shift();
                    carregarChat();
                } else if (dbMural.length > 0) {
                    const postAleatorio = dbMural[Math.floor(Math.random() * dbMural.length)];
                    postAleatorio.likes += 1;
                    carregarMural();
                }
                salvarDados();
            }, 15000);
        }
    </script>
</body>
</html>
